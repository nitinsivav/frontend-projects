<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <h1>Bookmark Saver</h1>

        <div class="input-set">
            <h2>Add Bookmark</h2>
            <input type="text" class="input-field" id="bookmark-title" placeholder="Enter bookmark title">
            <input type="text" class="input-field" id="bookmark-url" placeholder="Enter bookmark URL">
            <button class="add-button" id="add-bookmark">Save Bookmark</button>
        </div>

        <div class="bookmark-list">
            <h2>Bookmarks</h2>
            <ul id="bookmarks"></ul>
        </div>

    </div>
    

    <script src="script.js"></script>
</body>
</html>
