<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Github User Finder</title>

    <link rel="stylesheet" href="style.css" />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
      integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>

  <body>
    <div class="container">

      <header>
        <h1>Github User Finder</h1>
        <p>Find users on Github</p>
      </header>

      <div class="search-container">
        <input
          type="text"
          id="search-input"
          placeholder="Enter Github username..."
        />

        <button id="search-button">Search</button>
      </div>

      <div id="profile-container" class="profile-container hidden">

        <div class="profile-header">
          <img id="avatar" src="" alt="User Avatar" />

          <div class="profile-info">
            <h2 id="username"></h2>
            <p id="name"></p>
            <p id="bio"></p>
          </div>

          <div class="profile-links">
            <a id="profile-link" href="" target="_blank">
              View Profile
            </a>
          </div>
        </div>

        <div class="stats">

          <div class="stat">
            <p>
              <i class="fas fa-users"></i>
              <span id="followers"></span> followers
            </p>
          </div>

          <div class="stat">
            <p>
              <i class="fas fa-user-friends"></i>
              <span id="following"></span> following
            </p>
          </div>

          <div class="stat">
            <p>
              <i class="fas fa-code"></i>
              <span id="repos"></span> repositories
            </p>
          </div>

        </div>

        <div class="additional-info">

          <div class="info-item" id="company-container">
            <i class="fas fa-building"></i>
            <span id="company">Not specified</span>
          </div>

          <div class="info-item" id="blog-container">
            <i class="fas fa-link"></i>
            <a id="blog" target="_blank">No website</a>
          </div>

          <div class="info-item" id="twitter-container">
            <i class="fab fa-twitter"></i>
            <a id="twitter" target="_blank">No Twitter</a>
          </div>

        </div>

        <div class="repos-section">
          <h3>Latest Repositories</h3>

          <div id="repos-container" class="repos-container">
            <div class="loading-repos">
              Loading repositories...
            </div>
          </div>
        </div>

      </div>

      <div id="error-container" class="hidden">
        <p>No user found. Please try another username.</p>
      </div>

    </div>

    <script src="script.js"></script>
  </body>
</html>
