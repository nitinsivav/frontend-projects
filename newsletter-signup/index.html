<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Newsletter Signup</title>
    <link rel="stylesheet" href="style.css">
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
      integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
</head>
<body>

    <div class="container">

        <div class="main-icon">
            <i class="fa-solid fa-envelope-open"></i>
        </div>

        <div class="content">
            <h1>Subscribe to our Newsletter</h1>
            <p>Stay updated with the latest news and exclusive offers.</p>
        </div>

        <form action="#" method="POST" class="signup-form">
            <div class="input-group">
                <i class="fa-solid fa-user icon"></i>
                <input type="text" name="name" placeholder="Your Name" required>
            </div>
            <div class="input-group">
                <i class="fa-solid fa-envelope icon"></i>
                <input type="email" name="email" placeholder="Your Email" required>
            </div>
            <button>Subscribe <i class="fas fa-arrow-right"></i></button>
        </form>

        <div class="features">
            <p><i class="fa-solid fa-check"></i>  Exclusive content</p>
            <p><i class="fa-solid fa-check"></i>  Weekly updates</p>
            <p><i class="fa-solid fa-check"></i>  Special offers</p>
        </div>

    </div>
    
</body>
</html>
