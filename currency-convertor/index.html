<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Currency Convertor</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Currency Convertor</h1>

        <form id="currency-converter">

            <div class="input-group">
                <label for="amount">Amount:</label>
                <input type="number" id="amount" name="amount" placeholder="Enter Amount" min="0" step="1" required>
            </div>

            <div class="input-group">
                <label for="from-currency">From Currency:</label>
                <select id="from-currency" name="from-currency" required>
                    <option value="">Select Currency</option>
                </select>
            </div>

            <div class="input-group">
                <label for="to-currency">To Currency:</label>
                <select id="to-currency" name="to-currency" required>
                    <option value="">Select Currency</option>
                    
                </select>
            </div>

            <button type="submit">Convert Currency</button>

        </form>

        <div id="result">
            
        </div>


    </div>
    

    <script src="script.js"></script>
</body>
</html>
