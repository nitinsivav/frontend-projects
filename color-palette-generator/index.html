<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
      integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="style.css">
    <title>Color Palette Generator</title>
</head>
<body>

  <div class="container">
    <h1>Color Palette Generator</h1>

    <button id="generate-btn">
      <i class="fas fa-sync-alt"></i>
      Generate Palette
    </button>

    <div class="palette-container">

        <div class="color-box" id="color-box-1">
          <div class="color" style="background-color: #ff6b6b;"></div>
          <div class="color-info">
            <span class="color-code">#ff6b6b</span>
            <i class="fas fa-copy copy-btn"></i>     
          </div>
        </div>

        <div class="color-box" id="color-box-2">
          <div class="color" style="background-color: #feca57;"></div>
          <div class="color-info">
            <span class="color-code">#feca57</span>
            <i class="fas fa-copy copy-btn"></i>     
          </div>
        </div>
      

        <div class="color-box" id="color-box-3">
          <div class="color" style="background-color: #48dbfb;"></div>
          <div class="color-info">
            <span class="color-code">#48dbfb</span>
            <i class="fas fa-copy copy-btn"></i>     
          </div>
        </div>

        <div class="color-box" id="color-box-4">
          <div class="color" style="background-color: #1dd1a1;"></div>
          <div class="color-info">
            <span class="color-code">#1dd1a1</span>
            <i class="fas fa-copy copy-btn"></i>     
          </div>
        </div>

        <div class="color-box" id="color-box-5">
          <div class="color" style="background-color: #5f27cd;"></div>
          <div class="color-info">
            <span class="color-code">#5f27cd</span>
            <i class="fas fa-copy copy-btn"></i>     
          </div>
        </div>

    </div>


  </div>
    


  <script src="script.js"></script>
</body>
</html>
