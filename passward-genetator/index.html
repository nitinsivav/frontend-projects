<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Password Generator</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
      integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body>
    <div class="container">
        <h1>Password Generator</h1>
        <div class="password-container">

            <div class="password-display">
                <input type="text" id="password" readonly  />
                 <i class="fas fa-copy" id="copy-btn" title="Copy Password"></i>
            </div>
            <div class="options">

                <div class="option">
                    <label for="length">Password Length:</label>
                    <input type="range" id="length" name="length" min="6" max="24" value="12" />
                    <span id="lengthValue">12</span>
                </div>


                <div class="option">
                    <label for="uppercase">Include Uppercase Letters:</label>
                    <input type="checkbox" id="uppercase" name="uppercase" checked />
                </div>


                <div class="option">
                    <label for="lowercase">Include Lowercase Letters:</label>
                    <input type="checkbox" id="lowercase" name="lowercase" checked />
                </div>


                <div class="option">
                    <label for="numbers">Include Numbers:</label>
                    <input type="checkbox" id="numbers" name="numbers" checked />
                </div>

                <div class="option">
                    <label for="symbols">Include Symbols:</label>
                    <input type="checkbox" id="symbols" name="symbols" checked />
                </div>

            </div>

            <div class="generate-btn-container">
                <button id="generate-btn"><i class="fas fa-key"></i>Generate Password</button>
            </div>

            <div class="strength-container">
                <div class="strength-meter" id="strength-meter">
                    <div class="strength-bar" id="strength-bar"></div>
                </div>
                <p id="strength-description">Your password is <span id="strength-text">Medium</span> strength.</p>
            </div>

        </div>

    </div>
    <script src="script.js"></script>
  </body>
</html>
